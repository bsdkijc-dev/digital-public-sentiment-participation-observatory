name: DSPPO v1.1 QA & Privacy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qa-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Dataset Schema & Zero-PII Validation
        run: python3 scripts/validate_dsppo_datasets.py
      - name: Run Pipeline Unit Tests
        run: python3 scripts/test_pipeline.py -v
      - name: Verify Phase 6-9 Deliverables
        run: python3 scripts/verify_phase6_9_outputs.py
